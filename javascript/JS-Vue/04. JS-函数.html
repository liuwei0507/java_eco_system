<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS-函数</title>
</head>
<body>


<script>
    // 函数的定义及调用 -- 具名函数
    function add(a, b) {
        return a + b;
    }

    let result = add(10, 20)
    console.log(result)

    // 函数的定义 -- 匿名函数
    let add_2 = (a, b) => {
        return a + b;
    }
    console.log(add_2(20, 30))
    let add_3 = function (a, b) {
        return a + b;
    }
    console.log(add_3(30, 40))
</script>
</body>
</html>
